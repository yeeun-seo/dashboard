<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="author" content="ScienceBuild">
<title>Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#000; --fg:#f2f2f2; --sub:#9a9a9a; --dim:#5a5a5a; --line:rgba(255,255,255,.09);
    --accent:#7fb2ff; --warm:#ffb86b; --card:rgba(0,0,0,.38); --cardline:rgba(255,255,255,.08);
    --dtext:#b5b5b5; --dropc:180,205,255;
  }
  /* 낮: 밝은 테마 */
  body.light{--fg:#17202b; --sub:#45505e; --dim:#7a8593; --line:rgba(20,30,45,.13);
    --accent:#2a64c4; --warm:#d26d12; --card:rgba(255,255,255,.42); --cardline:rgba(255,255,255,.7);
    --dtext:#2e3946; --dropc:40,75,130}
  body{transition:color 2s}
  body.light .page{text-shadow:0 1px 10px rgba(255,255,255,.35)}
  body.light #rf{background:rgba(255,255,255,.4);border-color:rgba(0,0,0,.22);color:#334}
  body.light #dots i{background:rgba(0,0,0,.18)} body.light #dots i.on{background:#333}
  body.light .wd{border-bottom-color:rgba(0,0,0,.06)}
  body.light .wd.today{background:rgba(255,255,255,.55)}
  body.light .wbar{background:rgba(0,0,0,.1)}
  body.light .dt .dm{border-left-color:rgba(0,0,0,.25)}
  body.light .dt.sat .dw{color:#2a64c4} body.light .dt.sun .dw{color:#d23b2a}
  body.light .flake{box-shadow:0 0 3px rgba(60,80,110,.45)}
  body.light .fogb{background:radial-gradient(closest-side,rgba(255,255,255,.55),rgba(255,255,255,0))}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
    font-family:"Pretendard",-apple-system,"Noto Sans KR",sans-serif;
    -webkit-tap-highlight-color:transparent;user-select:none;touch-action:none}

  /* ---------- 동적 배경 ---------- */
  #bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;transition:opacity 2s}
  .bgl{position:absolute;inset:0;opacity:0;transition:opacity 3s ease}
  .bgl.on{opacity:1}
  #fx{position:absolute;inset:0;transition:opacity 1.5s}
  #shade{position:absolute;inset:0;background:#000;opacity:0;transition:opacity 3s}
  #flash{position:absolute;inset:0;background:#cfd8ff;opacity:0}
  #flash.on{animation:flash 11s infinite}
  @keyframes flash{0%,90%,100%{opacity:0}91%{opacity:.16}92%{opacity:0}94%{opacity:.26}96%{opacity:0}}

  .star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;
    animation:tw var(--d) ease-in-out infinite;animation-delay:var(--dl)}
  @keyframes tw{0%,100%{opacity:.12}50%{opacity:.85}}
  .sunglow{position:absolute;right:-18vw;top:-30vh;width:75vmax;height:75vmax;border-radius:50%;
    background:radial-gradient(closest-side,rgba(255,236,170,.55),rgba(255,236,170,0));animation:pulse 14s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.08);opacity:.75}}
  /* 구름: 윤곽이 또렷한 SVG 일러스트를 배경 이미지로 사용 (한 번만 그려지고 이동만 하므로 저사양 부담 적음) */
  .cloud{position:absolute;left:0;width:calc(var(--w) * 1vw);height:calc(var(--w) * .5vw);
    background:var(--img) center/contain no-repeat;opacity:var(--o);
    animation:drift var(--d) linear infinite, bob 16s ease-in-out infinite;animation-delay:var(--dl),var(--dl)}
  @keyframes drift{from{transform:translateX(-95vw)}to{transform:translateX(110vw)}}
  @keyframes bob{50%{translate:0 1.2vh}}
  .drop{position:absolute;top:-15vh;width:3px;height:14vh;rotate:6deg;border-radius:2px;
    background:linear-gradient(rgba(var(--dropc),0),rgba(var(--dropc),.7));
    animation:fall var(--d) linear infinite;animation-delay:var(--dl)}
  @keyframes fall{to{transform:translate(-12vh,130vh)}}
  .flake{position:absolute;top:-6vh;border-radius:50%;
    background:radial-gradient(circle,#fff 0,rgba(255,255,255,.95) 30%,rgba(255,255,255,.55) 60%,rgba(255,255,255,0) 100%);
    animation:snow var(--d) linear infinite;animation-delay:var(--dl)}
  @keyframes snow{0%{transform:translate(0,0)}25%{transform:translate(3vw,28vh)}50%{transform:translate(-1vw,56vh)}75%{transform:translate(3.5vw,84vh)}100%{transform:translate(0,114vh)}}
  .fogb{position:absolute;left:-50vw;width:200vw;height:34vh;
    background:radial-gradient(closest-side,rgba(210,210,210,.11),rgba(210,210,210,0));
    animation:fogm var(--d) ease-in-out infinite alternate;animation-delay:var(--dl)}
  @keyframes fogm{from{transform:translateX(-12vw)}to{transform:translateX(12vw)}}
  /* 현재 날씨 자리의 달 (실제 월령) */
  .moonic{position:relative;flex:none}
  .moonic svg{width:100%;height:100%;overflow:visible}
  .moonic .halo{animation:halo 8s ease-in-out infinite;transform-origin:50% 50%}
  @keyframes halo{50%{opacity:.7;transform:scale(1.03)}}
  /* 별똥별: 빛나는 머리 + 긴 꼬리, 좌측 하단 방향으로 떨어짐 */
  .shoot{position:absolute;width:24vw;height:2.6px;border-radius:2px;rotate:-30deg;opacity:0;
    background:linear-gradient(270deg,rgba(255,255,255,0),rgba(214,230,255,.35) 55%,rgba(255,255,255,.95));
    animation:shoot var(--d) linear infinite;animation-delay:var(--dl)}
  .shoot::before{content:"";position:absolute;left:-3px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;
    background:#fff;box-shadow:0 0 10px 4px rgba(200,220,255,.85),0 0 22px 8px rgba(160,190,255,.35)}
  @keyframes shoot{0%{opacity:0;transform:translateX(0)}1.5%{opacity:1}8%{opacity:0;transform:translateX(-36vw)}100%{opacity:0;transform:translateX(-36vw)}}
  body.paused *{animation-play-state:paused !important}

  /* ---------- 페이지 트랙 (스와이프) ---------- */
  #track{position:relative;z-index:1;display:flex;width:200vw;height:100vh;transition:transform .3s ease,opacity 2s}
  body.dim #track, body.dim #bg{opacity:.35}
  .page{width:100vw;height:100vh;flex:none;overflow:hidden;text-shadow:0 1px 10px rgba(0,0,0,.35)}

  /* ---------- 1페이지: 시계 + 날씨 ---------- */
  #p1{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);padding:4vh 4vw;gap:3vw}
  .clock{display:flex;flex-direction:column;justify-content:center;border-right:1px solid var(--line);padding-right:3vw}
  .date{font-size:clamp(18px,3.4vh,40px);color:var(--sub);font-weight:500;letter-spacing:.02em}
  .time{font-weight:200;font-variant-numeric:tabular-nums;line-height:.9;
    font-size:min(15vw,40vh);letter-spacing:-.03em;margin-top:1vh;white-space:nowrap}
  .time .colon{animation:blink 2s steps(1) infinite}
  @keyframes blink{50%{opacity:.25}}
  .meta{display:flex;align-items:baseline;gap:1.2vw;margin-top:1.5vh}
  .ampm{font-size:clamp(18px,4vh,46px);color:var(--sub);font-weight:400}
  .sec{font-size:clamp(18px,4vh,46px);color:var(--dim);font-variant-numeric:tabular-nums;font-weight:300}

  /* 날씨 블록 공통 */
  .wx{display:flex;flex-direction:column;justify-content:center;gap:3vh;min-width:0}
  .hdr{display:flex;align-items:center;gap:2.2em;min-width:0}
  .dt{display:flex;align-items:center;gap:.9em;line-height:1}
  #p1 .dt{display:none}
  .dt .dd{font-weight:200;font-size:7vh;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .dt .dm{display:flex;flex-direction:column;gap:.55vh;padding-left:.9em;border-left:1px solid rgba(255,255,255,.28)}
  .dt .dw{font-weight:600;font-size:2.5vh;letter-spacing:.12em}
  .dt .dy{font-size:1.7vh;color:var(--sub);letter-spacing:.22em;font-variant-numeric:tabular-nums}
  .dt.sat .dw{color:#8fb8ff} .dt.sun .dw{color:#ff9a8a}
  .loc{font-size:clamp(14px,2.4vh,28px);color:var(--sub);display:flex;align-items:center;gap:.6em;cursor:pointer;width:max-content}
  .loc svg{width:1em;height:1em}
  .now{display:flex;align-items:center;gap:2vw}
  .now .ic{width:min(13vw,20vh);height:min(13vw,20vh);flex:none}
  .now .t{font-size:min(9vw,17vh);font-weight:200;line-height:1;font-variant-numeric:tabular-nums}
  .now .d{font-size:clamp(14px,2.6vh,30px);color:var(--dtext);margin-top:.6vh;line-height:1.45}
  .periods{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1.5vw}
  .p{border:1px solid var(--cardline);border-radius:18px;padding:2.2vh 1.6vw;display:flex;flex-direction:column;gap:1vh;background:var(--card)}
  .p .h{font-size:clamp(14px,2.4vh,28px);color:var(--sub);font-weight:600;display:flex;justify-content:space-between}
  .p .h small{font-weight:400;color:var(--dim)}
  .p .row{display:flex;align-items:center;gap:1vw}
  .p .ic{width:min(4.6vw,9vh);height:min(4.6vw,9vh);flex:none}
  .p .tt{font-size:min(3.3vw,6.5vh);font-weight:300;font-variant-numeric:tabular-nums;line-height:1;white-space:nowrap}
  .p .c{font-size:clamp(13px,2.3vh,26px)}
  .p .r{font-size:clamp(12px,2.1vh,24px);color:var(--accent)}
  .p.past{opacity:.5}
  .upd{font-size:clamp(11px,1.6vh,18px);color:var(--dim)}
  .ic{color:var(--fg)}
  .ic .sun{color:var(--warm)} .ic .drop2{color:var(--accent)}

  /* ---------- 2페이지: 위쪽 절반 날씨 / 아래쪽 절반 주간 날씨 ---------- */
  #p2{display:flex;flex-direction:column}
  #p2 .top{height:50vh;padding:3.5vh 6vw 2.5vh;border-bottom:1px solid var(--line);display:flex}
  #p2 .bottom{height:50vh;padding:2.2vh 6vw 5vh;display:flex;flex-direction:column}
  #p2 .wx{flex:1;gap:2.4vh}
  #p2 .loc{font-size:clamp(14px,2vh,26px)}
  #p2 .now{gap:4vw}
  #p2 .now .ic{width:min(22vw,13vh);height:min(22vw,13vh)}
  #p2 .now .t{font-size:min(20vw,11vh)}
  #p2 .now .d{font-size:clamp(13px,1.9vh,26px)}
  #p2 .periods{gap:3vw}
  #p2 .p{padding:1.8vh 3.5vw;gap:.8vh;border-radius:16px}
  #p2 .p .h{font-size:clamp(13px,1.8vh,24px)}
  #p2 .p .row{gap:2vw}
  #p2 .p .ic{width:min(9vw,6vh);height:min(9vw,6vh)}
  #p2 .p .tt{font-size:min(6vw,4.2vh)}
  #p2 .p .c{font-size:clamp(12px,1.8vh,24px)}
  #p2 .p .r{font-size:clamp(12px,1.7vh,22px)}
  #p2 .upd{font-size:clamp(10px,1.3vh,16px)}

  /* 주간 날씨 — 세로 화면: 7줄 목록 */
  .week{flex:1;display:flex;flex-direction:column;min-height:0}
  .wh{font-size:clamp(12px,1.8vh,24px);color:var(--sub);font-weight:600;margin-bottom:1vh}
  .wl{flex:1;display:flex;flex-direction:column;min-height:0}
  .wd{flex:1;display:grid;grid-template-columns:3.2em 3em 2.2em 3em 2.4em minmax(0,1fr) 2.4em;
    align-items:center;column-gap:.7em;font-size:2.2vh;border-bottom:1px solid rgba(255,255,255,.05);
    font-variant-numeric:tabular-nums}
  .wd:last-child{border-bottom:0}
  .wd .wdn{font-weight:600}
  .wd .wdd{color:var(--sub)}
  .wd .wic{width:2.2em;height:2.2em}
  .wd .wpop{color:var(--accent);text-align:right}
  .wd .wpop.low{color:var(--dim)}
  .wd .wmin{color:var(--sub);text-align:right}
  .wd .wmax{text-align:left}
  .wbar{position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,.08)}
  .wbar i{position:absolute;top:0;bottom:0;left:var(--a);width:var(--b);border-radius:3px;
    background:linear-gradient(90deg,var(--accent),var(--warm))}
  .wd.today{background:rgba(255,255,255,.05);border-radius:12px}
  .wd.today .wdn{color:var(--warm)}

  /* 1페이지 세로 배치 */
  @media (orientation:portrait){
    #p1{grid-template-columns:1fr;grid-template-rows:1fr 1.1fr;padding:4vh 5vw}
    #p1 .clock{border-right:0;border-bottom:1px solid var(--line);padding:0 0 3vh;align-items:center}
    #p1 .time{font-size:min(26vw,22vh)}
    #p1 .now .ic{width:18vw;height:18vw} #p1 .now .t{font-size:16vw}
    #p1 .p .ic{width:11vw;height:11vw} #p1 .p .tt{font-size:7.5vw}
    .wd{padding:0 .5em}
    /* 2페이지 세로: 날짜 헤더 추가분만큼 위쪽 절반 압축 */
    #p2 .top{padding:2.6vh 6vw 1.8vh}
    #p2 .wx{gap:1.5vh}
    #p2 .dt .dd{font-size:5.6vh}
    #p2 .dt .dw{font-size:2.1vh}
    #p2 .dt .dy{font-size:1.5vh}
    #p2 .now .ic{width:min(22vw,10.5vh);height:min(22vw,10.5vh)}
    #p2 .now .t{font-size:min(20vw,9.5vh)}
    #p2 .p{padding:1.4vh 3.5vw;gap:.6vh}
  }
  /* 2페이지 가로 화면 */
  @media (orientation:landscape){
    #p2 .top{padding:3vh calc(1.4vw + 68px) 2.5vh 4vw}
    #p2 .wx{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);
      grid-template-rows:auto 1fr auto;column-gap:3vw;row-gap:1vh}
    #p2 .hdr{grid-column:1;grid-row:1}
    #p2 .loc{font-size:2.6vh}
    #p2 .dt .dd{font-size:8.5vh}
    #p2 .dt .dw{font-size:2.9vh}
    #p2 .dt .dy{font-size:1.9vh}
    #p2 .now{grid-column:1;grid-row:2;align-self:center;gap:2.5vw}
    #p2 .upd{grid-column:1;grid-row:3;font-size:1.8vh}
    #p2 .now .ic{width:16vh;height:16vh}
    #p2 .now .t{font-size:16vh}
    #p2 .now .d{font-size:3vh;line-height:1.5}
    #p2 .periods{grid-column:2;grid-row:1/4;align-self:stretch;gap:1.6vw}
    #p2 .p{justify-content:center;gap:1.4vh;padding:2.2vh 1.8vw;border-radius:20px}
    #p2 .p .h{font-size:2.8vh}
    #p2 .p .row{flex-direction:column;align-items:flex-start;gap:1.2vh}
    #p2 .p .ic{width:9vh;height:9vh}
    #p2 .p .tt{font-size:7vh}
    #p2 .p .c{font-size:2.9vh}
    #p2 .p .r{font-size:2.6vh}

    /* 주간 날씨 — 가로 화면: 7칸 가로 배열 */
    #p2 .bottom{padding:2.2vh 4vw 5vh}
    .wh{font-size:2.4vh}
    .wl{flex-direction:row;gap:1vw}
    .wd{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9vh;
      border-bottom:0;border:1px solid var(--cardline);border-radius:16px;background:var(--card);font-size:2.6vh}
    .wd.today{background:rgba(255,255,255,.08);border-color:rgba(255,184,107,.35)}
    .wd{gap:1.1vh}
    .wd .wdn{order:1;font-size:3.6vh}
    .wd .wdd{order:2;font-size:2.4vh}
    .wd .wic{order:3;width:9vh;height:9vh}
    .wd .wmax{order:4;font-size:4.8vh;text-align:center;line-height:1}
    .wd .wbar{display:none}
    .wd .wmin{order:6;font-size:4vh;text-align:center;line-height:1}
    .wd .wpop{order:7;font-size:2.9vh;text-align:center}
  }

  /* ---------- 상태 표시 ---------- */
  #wl{position:fixed;right:1.2vw;bottom:1.2vh;width:8px;height:8px;border-radius:50%;background:#333;z-index:5}
  #wl.on{background:#2e7d32}
  #dots{position:fixed;left:50%;bottom:1.6vh;transform:translateX(-50%);display:flex;gap:10px;transition:opacity 1.5s;pointer-events:none;z-index:5}
  #dots i{width:8px;height:8px;border-radius:50%;background:#444;display:block}
  #dots i.on{background:#ccc}
  #dots.hide{opacity:0}

  /* 새로고침 버튼 */
  #rf{position:fixed;right:1.4vw;top:1.6vh;width:52px;height:52px;border-radius:50%;
    background:rgba(0,0,0,.2);border:1.5px solid #666;color:#999;display:flex;align-items:center;justify-content:center;
    cursor:pointer;z-index:5;touch-action:manipulation}
  #rf:active{background:#151515;border-color:#aaa;color:#eee}
  #rf svg{width:24px;height:24px}
  #rf.spin svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- 설정 ---------- */
  #set{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:9;touch-action:auto}
  #set.show{display:flex}
  .panel{width:min(560px,90vw);background:#111;border:1px solid #2a2a2a;border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:18px;font-size:18px}
  .panel h2{font-size:22px;font-weight:600}
  .panel input{width:100%;background:#000;border:1px solid #333;color:var(--fg);border-radius:12px;padding:14px;font-size:18px;font-family:inherit}
  .panel button{background:#1d1d1d;border:1px solid #333;color:var(--fg);border-radius:12px;padding:12px 16px;font-size:17px;font-family:inherit;cursor:pointer}
  .panel .res button{width:100%;text-align:left;margin-top:8px}
  .panel .tog{display:flex;justify-content:space-between;align-items:center}
  .panel .btns{display:flex;gap:10px;justify-content:flex-end}
</style>
</head>
<body>
<div id="bg"><div id="shade"></div><div id="fx"></div><div id="flash"></div></div>

<div id="track">
  <!-- 1페이지 -->
  <div class="page" id="p1">
    <section class="clock">
      <div class="date" id="date">—</div>
      <div class="time" id="time">--<span class="colon">:</span>--</div>
      <div class="meta"><span class="ampm" id="ampm"></span><span class="sec" id="sec"></span></div>
    </section>
    <section class="wx wxbox"></section>
  </div>
  <!-- 2페이지 -->
  <div class="page" id="p2">
    <div class="top"><section class="wx wxbox"></section></div>
    <div class="bottom"><section class="week" id="week"></section></div>
  </div>
</div>
<div id="dots"><i></i><i></i></div>
<div id="wl" title="화면 켜짐 유지"></div>
<button id="rf" aria-label="새로고침"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg></button>

<div id="set">
  <div class="panel">
    <h2>설정</h2>
    <div>
      <input id="q" placeholder="도시 검색 (예: 서울, Busan, 성남)">
      <div class="res" id="res"></div>
    </div>
    <button id="gps">현재 위치 사용</button>
    <div class="tog"><span>24시간제</span><input type="checkbox" id="h24" style="width:24px;height:24px"></div>
    <div class="tog"><span>야간 자동 감광 (23–06시)</span><input type="checkbox" id="nightDim" style="width:24px;height:24px"></div>
    <div class="btns"><button id="close">닫기</button></div>
  </div>
</div>

<script>
(() => {
  // ---------- 설정 ----------
  const store = {
    get(k, d){ try{ const v = localStorage.getItem('dash_'+k); return v===null? d : JSON.parse(v);}catch(e){return d;} },
    set(k, v){ try{ localStorage.setItem('dash_'+k, JSON.stringify(v)); }catch(e){} }
  };
  let cfg = Object.assign({ name:'서울', lat:37.5665, lon:126.9780, h24:true, nightDim:true, page:0 }, store.get('cfg', {}));
  const save = () => store.set('cfg', cfg);
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2,'0');
  const DAYS = ['일','월','화','수','목','금','토'];
  const rnd = (a,b) => a + Math.random()*(b-a);

  // ---------- 시계 ----------
  let lastMinute = -1;
  function tick(){
    const d = new Date();
    const h = d.getHours(), m = d.getMinutes();
    $('date').textContent = `${d.getMonth()+1}월 ${d.getDate()}일 ${DAYS[d.getDay()]}요일`;
    if (cfg.h24){
      $('time').innerHTML = `${pad(h)}<span class="colon">:</span>${pad(m)}`;
      $('ampm').textContent = '';
    } else {
      $('time').innerHTML = `${h % 12 || 12}<span class="colon">:</span>${pad(m)}`;
      $('ampm').textContent = h < 12 ? '오전' : '오후';
    }
    $('sec').textContent = pad(d.getSeconds());
    const night = cfg.nightDim && (h >= 23 || h < 6);
    document.body.classList.toggle('dim', night);
    document.body.classList.toggle('paused', night);       // 감광 시간대 애니메이션 정지
    if (m !== lastMinute){
      lastMinute = m;
      if (lastData) applyScene(lastData);                    // 일출·일몰 전환 반영
      document.querySelectorAll('.dt').forEach(el => el.outerHTML = dateHTML());   // 날짜 변경 반영
    }
  }

  // LCD 잔상 방지용 미세 픽셀 이동 (10분 주기)
  setInterval(() => {
    const x = Math.round(Math.random()*6-3), y = Math.round(Math.random()*6-3);
    document.querySelectorAll('.page').forEach(p => p.style.translate = `${x}px ${y}px`);
  }, 600000);

  // ---------- 날씨 아이콘 ----------
  const SUN = `<g class="sun"><circle cx="32" cy="32" r="10"/><path d="M32 10v6M32 48v6M10 32h6M48 32h6M16.4 16.4l4.2 4.2M43.4 43.4l4.2 4.2M16.4 47.6l4.2-4.2M43.4 20.6l4.2-4.2"/></g>`;
  const MOON = `<g class="sun"><path d="M40 14a18 18 0 1 0 12 26A15 15 0 0 1 40 14z"/></g>`;
  const CLOUD = `<path d="M20 48h26a10 10 0 0 0 1-20 14 14 0 0 0-27-2 11 11 0 0 0 0 22z"/>`;
  const CLOUD_S_D = 'M24 50h22a9 9 0 0 0 1-18 12 12 0 0 0-23-2 10 10 0 0 0 0 20z';
  const CLOUD_S = `<path d="${CLOUD_S_D}"/>`;
  // 구름 뒤로 해/달이 가려지도록 구름 모양만큼 잘라내는 클립
  const PC_CLIP = `<defs><clipPath id="pcClip"><path clip-rule="evenodd" d="M-10 -10H74V74H-10Z ${CLOUD_S_D}"/></clipPath></defs>`;
  const SUN_S = `<g class="sun"><circle cx="24" cy="24" r="8"/><path d="M24 8v4M8 24h4M12.7 12.7l2.8 2.8M35.3 12.7l-2.8 2.8"/></g>`;
  const MOON_S = `<g class="sun"><path d="M30 12a12 12 0 1 0 8 17 10 10 0 0 1-8-17z"/></g>`;
  const C_UP = `<path d="M20 40h26a10 10 0 0 0 1-20 14 14 0 0 0-27-2 11 11 0 0 0 0 22z"/>`;
  const RAIN = `<g class="drop2"><path d="M24 46l-3 8M34 46l-3 8M44 46l-3 8"/></g>`;
  const SNOW = `<g class="drop2"><path d="M24 48v6M21 51h6M36 48v6M33 51h6M48 48v6M45 51h6"/></g>`;
  const BOLT = `<g class="sun"><path d="M34 42l-6 10h7l-4 9"/></g>`;
  const FOG = `<path d="M14 26h36M10 34h44M16 42h32"/>`;

  function typeOf(code){
    if (code <= 1) return 'clear';
    if (code === 2) return 'partly';
    if (code === 3) return 'cloudy';
    if (code === 45 || code === 48) return 'fog';
    if ((code>=71 && code<=77) || code===85 || code===86) return 'snow';
    if (code >= 95) return 'thunder';
    return 'rain';
  }
  function icon(code, isDay=true){
    let g;
    switch(typeOf(code)){
      case 'clear':  g = isDay ? SUN : MOON; break;
      case 'partly': g = PC_CLIP + `<g clip-path="url(#pcClip)">${isDay ? SUN_S : MOON_S}</g>` + CLOUD_S; break;
      case 'cloudy': g = CLOUD; break;
      case 'fog':    g = FOG; break;
      case 'rain':   g = C_UP + RAIN; break;
      case 'snow':   g = C_UP + SNOW; break;
      case 'thunder':g = C_UP + BOLT; break;
    }
    return `<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${g}</svg>`;
  }
  const DESC = {0:'맑음',1:'대체로 맑음',2:'구름 조금',3:'흐림',45:'안개',48:'안개',51:'이슬비',53:'이슬비',55:'이슬비',
    56:'어는 이슬비',57:'어는 이슬비',61:'약한 비',63:'비',65:'강한 비',66:'어는 비',67:'어는 비',71:'약한 눈',73:'눈',75:'강한 눈',
    77:'싸락눈',80:'약한 소나기',81:'소나기',82:'강한 소나기',85:'약한 눈',86:'눈',95:'뇌우',96:'뇌우·우박',99:'뇌우·우박'};
  const desc = c => DESC[c] ?? '—';
  const PIN = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>`;

  // ---------- 동적 배경 ----------
  const SCENES = {
    clearDay:   { bg:'linear-gradient(180deg,#0a1c36 0%,#123a66 58%,#1b5687 100%)', fx:'sun' },
    clearNight: { bg:'linear-gradient(180deg,#02040a 0%,#060d22 60%,#0c1838 100%)', fx:'stars' },
    dusk:       { bg:'linear-gradient(180deg,#110b24 0%,#36203f 50%,#7d3f2c 100%)', fx:'none' },
    partly:     { bg:'linear-gradient(180deg,#101b28 0%,#1e3044 60%,#2a4258 100%)', fx:'clouds' },
    cloudy:     { bg:'linear-gradient(180deg,#121417 0%,#22272d 60%,#2e343b 100%)', fx:'cloudsDense' },
    rain:       { bg:'linear-gradient(180deg,#0b1118 0%,#16212c 60%,#1f2d3a 100%)', fx:'rain' },
    snow:       { bg:'linear-gradient(180deg,#141a21 0%,#25303b 60%,#33404d 100%)', fx:'snow' },
    thunder:    { bg:'linear-gradient(180deg,#09080f 0%,#16131f 60%,#211c2e 100%)', fx:'thunder' },
    fog:        { bg:'linear-gradient(180deg,#17191b 0%,#26292c 60%,#33373a 100%)', fx:'fog' }
  };
  // 낮(밝은 테마) 배경
  const DAY_BG = {
    clearDay: 'linear-gradient(180deg,#3f8fe0 0%,#74b4ef 55%,#bfdcf7 100%)',
    partly:   'linear-gradient(180deg,#5b98d0 0%,#8dbbe3 55%,#c6dcef 100%)',
    cloudy:   'linear-gradient(180deg,#8994a1 0%,#aab3bd 55%,#ccd2d8 100%)',
    rain:     'linear-gradient(180deg,#6d7c8b 0%,#8e9aa7 55%,#b3bcc5 100%)',
    snow:     'linear-gradient(180deg,#a9b7c6 0%,#c9d3dd 55%,#e6ebf0 100%)',
    fog:      'linear-gradient(180deg,#b9bfc5 0%,#d0d5d9 55%,#e6e9ec 100%)'
  };
  let curScene = null;

  function pickScene(d){
    const c = d.current, t = typeOf(c.weather_code), isDay = c.is_day === 1;
    if ((t === 'clear' || t === 'partly') && d.daily.sunrise && d.daily.sunset){
      const now = Date.now(), W = 40*60*1000;
      const sr = new Date(d.daily.sunrise[0]).getTime(), ss = new Date(d.daily.sunset[0]).getTime();
      if (Math.abs(now - sr) < W || Math.abs(now - ss) < W) return { key:'dusk', night:false };
    }
    if (t === 'clear') return { key: isDay ? 'clearDay' : 'clearNight', night:false };
    return { key: t, night: !isDay };
  }

  // ---------- 달: 월령 계산 + 디자인 ----------
  // 기준 신월 2000-01-06 18:14 UTC, 삭망월 29.530588853일
  function moonPhase(t = Date.now()){
    const days = (t - Date.UTC(2000,0,6,18,14)) / 86400000, L = 29.530588853;
    return (((days % L) + L) % L) / L;          // 0 신월 · 0.25 상현 · 0.5 보름 · 0.75 하현
  }
  // 달: 노란빛의 심플한 형태 (무늬 없음, 실제 월령 모양만 반영)
  function moonSVG(p){
    const r = 50, c = 50, k = Math.cos(2*Math.PI*p), rx = Math.abs(k)*r, illum = (1 - k)/2;
    const waxing = p < 0.5;                       // 북반구: 차오를 때 오른쪽이 밝음
    const outer = waxing ? 1 : 0, term = waxing ? (k > 0 ? 0 : 1) : (k > 0 ? 1 : 0);
    const lit = `M${c} ${c-r} A${r} ${r} 0 0 ${outer} ${c} ${c+r} A${rx.toFixed(2)} ${r} 0 0 ${term} ${c} ${c-r}Z`;
    const g = (.45 + illum*.55).toFixed(2);
    return `<div class="ic moonic"><svg viewBox="0 0 100 100">
      <defs>
        <radialGradient id="mLit" cx="38%" cy="34%" r="78%"><stop offset="0" stop-color="#fff6c4"/><stop offset=".55" stop-color="#ffe183"/><stop offset="1" stop-color="#f5c451"/></radialGradient>
        <radialGradient id="mGlow1" r="50%"><stop offset=".64" stop-color="#ffd76a" stop-opacity=".40"/><stop offset="1" stop-color="#ffd76a" stop-opacity="0"/></radialGradient>
        <radialGradient id="mGlow2" r="50%"><stop offset=".3" stop-color="#ffe9a8" stop-opacity=".12"/><stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/></radialGradient>
      </defs>
      <circle class="halo" cx="50" cy="50" r="120" fill="url(#mGlow2)" opacity="${g}"/>
      <circle class="halo" cx="50" cy="50" r="72" fill="url(#mGlow1)" opacity="${g}"/>
      <circle cx="50" cy="50" r="50" fill="#0d1524" fill-opacity=".5"/>
      ${illum > 0.02 ? `<path d="${lit}" fill="url(#mLit)"/>` : ''}
    </svg></div>`;
  }

  const starsHTML = k => { let h=''; for (let i=0;i<k;i++) h += `<i class="star" style="left:${rnd(0,100)}%;top:${rnd(0,70)}%;--d:${rnd(3,7).toFixed(1)}s;--dl:-${rnd(0,7).toFixed(1)}s;${Math.random()<.2?'width:3px;height:3px;':''}"></i>`; return h; };
  // 구름 모양 3종 (원 여러 개를 합친 실루엣, 위→아래 밝기 그라데이션, 가장자리만 살짝 부드럽게)
  const CLOUD_SHAPES = [
    [[48,64,24],[82,46,32],[122,50,30],[154,64,22],[100,70,30],[70,72,22],[132,74,20]],
    [[40,70,20],[70,54,28],[108,40,34],[146,56,26],[172,70,16],[96,74,26],[132,76,22]],
    [[30,72,16],[58,62,22],[92,56,24],[128,58,22],[160,66,18],[186,74,12],[110,76,20],[64,78,16]]
  ];
  function cloudImg(shape, tone){
    const top = tone === 'night' ? '#c9d3e2' : '#ffffff', bot = tone === 'night' ? '#6e7b8f' : (tone === 'grey' ? '#9aa6b5' : '#c5d1e0');
    const circles = CLOUD_SHAPES[shape].map(([x,y,r]) => `<circle cx='${x}' cy='${y}' r='${r}'/>`).join('');
    const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 100'><defs>`
      + `<linearGradient id='g' gradientUnits='userSpaceOnUse' x1='0' y1='12' x2='0' y2='98'><stop offset='0' stop-color='${top}'/><stop offset='.55' stop-color='${top}' stop-opacity='.92'/><stop offset='1' stop-color='${bot}'/></linearGradient>`
      + `<filter id='f' x='-10%' y='-10%' width='120%' height='120%'><feGaussianBlur stdDeviation='1.6'/></filter></defs>`
      + `<g fill='url(#g)' filter='url(#f)'>${circles}<rect x='40' y='66' width='124' height='28' rx='14'/></g></svg>`;
    return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
  }
  const cloudsHTML = (k, o1, o2, d1, d2, w1, w2, tone) => { let h=''; for (let i=0;i<k;i++){
    const d = rnd(d1,d2), back = i % 2 === 0, w = back ? rnd(w1+8, w2+12) : rnd(w1, w2);
    const o = back ? rnd(o1,o2)*.65 : rnd(o1,o2);
    h += `<i class="cloud" style="--img:${cloudImg(i%3, tone).replace(/"/g,'&quot;')};top:${rnd(-10,55).toFixed(1)}%;--w:${w.toFixed(0)};--o:${o.toFixed(2)};--d:${(back ? d*1.5 : d).toFixed(0)}s;--dl:-${rnd(0,d).toFixed(0)}s"></i>`; } return h; };
  // 별똥별: 현재 날씨가 있는 좌측 영역을 가로지르도록 시작점을 화면 왼쪽~중앙 위쪽에 배치 (주기를 서로 다르게)
  const shootHTML = () => [[46,4,9,-2],[58,14,13,-8],[38,22,11,-5],[52,-2,16,-12]]
    .map(([l,t,d,dl]) => `<i class="shoot" style="left:${l}%;top:${t}%;--d:${d}s;--dl:${dl}s"></i>`).join('');

  function buildFx(type, light){
    let h = '';
    const n = (k, f) => { for (let i=0;i<k;i++) h += f(i); };
    switch(type){
      case 'sun':
        h = `<div class="sunglow"></div>`; break;
      case 'stars':                                           // 맑은 밤: 별 + 별똥별
        h = starsHTML(55) + shootHTML(); break;
      case 'clouds':                                          // 구름 조금(낮)
        h = cloudsHTML(5, .75, .95, 80, 130, 26, 44, 'day'); break;
      case 'cloudsNight':                                     // 구름 조금(밤): 별 + 구름
        h = starsHTML(25) + shootHTML() + cloudsHTML(4, .22, .34, 90, 140, 26, 42, 'night'); break;
      case 'cloudsDense':                                     // 흐림
        h = light ? cloudsHTML(9, .55, .85, 90, 160, 32, 56, 'day') : cloudsHTML(9, .26, .42, 90, 160, 32, 56, 'grey'); break;
      case 'rain': case 'thunder':
        n(70, () => `<i class="drop" style="left:${rnd(0,115)}%;--d:${rnd(.7,1.2).toFixed(2)}s;--dl:-${rnd(0,1.2).toFixed(2)}s"></i>`);
        break;
      case 'snow':
        n(60, () => { const big = Math.random() < .35, s = (big ? rnd(20,34) : rnd(9,18)).toFixed(1);   // 함박눈: 큰 송이 35%
          const d = big ? rnd(11,17) : rnd(9,14);
          return `<i class="flake" style="left:${rnd(-3,100)}%;width:${s}px;height:${s}px;opacity:${(big ? rnd(.75,.95) : rnd(.6,.9)).toFixed(2)};--d:${d.toFixed(1)}s;--dl:-${rnd(0,d).toFixed(1)}s"></i>`; });
        break;
      case 'fog':
        n(4, i => `<i class="fogb" style="top:${10 + i*22}%;--d:${rnd(18,30).toFixed(0)}s;--dl:-${rnd(0,30).toFixed(0)}s"></i>`);
        break;
    }
    return h;
  }

  function applyScene(d){
    if (!d || !d.current) return;
    const s = pickScene(d);
    const light = !s.night && DAY_BG[s.key] !== undefined;      // 낮 = 밝은 테마 (뇌우·노을 제외)
    const id = s.key + (s.night ? '-n' : '') + (light ? '-l' : '');
    if (id === curScene) return;
    const first = curScene === null;
    curScene = id;
    const sc = SCENES[s.key];
    const fxType = (s.key === 'partly' && s.night) ? 'cloudsNight' : sc.fx;
    // 배경 그라데이션 교차 전환 (3초)
    const bg = $('bg');
    const layer = document.createElement('div');
    layer.className = 'bgl';
    layer.style.background = light ? DAY_BG[s.key] : sc.bg;
    document.body.classList.toggle('light', light);
    bg.insertBefore(layer, $('shade'));   // 밤 음영은 배경만 어둡게, 눈·비·별은 선명하게
    requestAnimationFrame(() => requestAnimationFrame(() => layer.classList.add('on')));
    const olds = [...bg.querySelectorAll('.bgl')].filter(e => e !== layer);
    setTimeout(() => olds.forEach(e => e.remove()), 3300);
    // 날씨 효과 교체
    const fx = $('fx');
    fx.style.opacity = 0;
    setTimeout(() => { fx.innerHTML = buildFx(fxType, light); fx.style.opacity = 1; }, first ? 0 : 1500);
    $('shade').style.opacity = (s.night && s.key !== 'partly') ? .35 : (s.night ? .2 : 0);
    $('flash').classList.toggle('on', s.key === 'thunder');
  }

  // ---------- 날씨 ----------
  let lastData = null;

  async function loadWeather(){
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${cfg.lat}&longitude=${cfg.lon}`
      + `&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,is_day,wind_speed_10m`
      + `&hourly=temperature_2m,weather_code,precipitation_probability`
      + `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset`
      + `&timezone=auto&forecast_days=7&wind_speed_unit=ms`;
    try{
      const r = await fetch(url, {cache:'no-store'});
      if(!r.ok) throw new Error(r.status);
      lastData = await r.json();
      store.set('wx', lastData);
      render(lastData, false);
    }catch(e){
      const cached = lastData || store.get('wx', null);
      if (cached){ lastData = cached; render(cached, true); }
      else document.querySelectorAll('.wxbox').forEach(b => b.innerHTML =
        `<div class="loc">${PIN}<span>${cfg.name}</span></div><div class="now"><div class="d">날씨를 불러오지 못했습니다 (네트워크 확인)</div></div>`);
      setTimeout(loadWeather, 60000);
    }
  }

  function summarize(h, dateStr, from, to){
    const idx = [];
    h.time.forEach((t,i) => {
      if (t.slice(0,10) !== dateStr) return;
      const hr = +t.slice(11,13);
      if (hr >= from && hr < to) idx.push(i);
    });
    if (!idx.length) return null;
    const temps = idx.map(i => h.temperature_2m[i]);
    const codes = idx.map(i => h.weather_code[i]);
    const pops  = idx.map(i => h.precipitation_probability[i] ?? 0);
    // 대표 날씨: 2시간 이상 나타난 코드 중 가장 심한 것, 없으면 최빈값
    const cnt = {}; codes.forEach(c => cnt[c] = (cnt[c]||0)+1);
    const keys = Object.keys(cnt).map(Number);
    const sev = keys.filter(c => cnt[c] >= 2).sort((a,b)=>b-a);
    const mode = keys.sort((a,b)=>cnt[b]-cnt[a])[0];
    return { code: sev.length ? sev[0] : mode,
      min: Math.round(Math.min(...temps)), max: Math.round(Math.max(...temps)), pop: Math.max(...pops) };
  }

  function periodHTML(label, range, s, past){
    if (!s) return `<div class="p"><div class="h">${label}</div><div class="c">자료 없음</div></div>`;
    return `<div class="p${past?' past':''}"><div class="h">${label}<small>${range}</small></div>
      <div class="row"><div class="ic">${icon(s.code,true)}</div><div class="tt">${s.min}°<span style="color:var(--dim)">/</span>${s.max}°</div></div>
      <div class="c">${desc(s.code)}</div>
      <div class="r">강수확률 ${s.pop}%</div></div>`;
  }

  function weekHTML(d){
    const dl = d.daily;
    if (!dl || !dl.weather_code || dl.time.length < 2) return '';
    const n = Math.min(7, dl.time.length);
    const mins = dl.temperature_2m_min.slice(0,n), maxs = dl.temperature_2m_max.slice(0,n);
    const gmin = Math.min(...mins), gmax = Math.max(...maxs), span = Math.max(1, gmax - gmin);
    let rows = '';
    for (let i=0;i<n;i++){
      const dt = new Date(dl.time[i] + 'T00:00');
      const lo = mins[i], hi = maxs[i];
      const a = ((lo - gmin)/span*100).toFixed(1), b = ((hi - lo)/span*100).toFixed(1), t = ((gmax - hi)/span*100).toFixed(1);
      const pop = dl.precipitation_probability_max ? (dl.precipitation_probability_max[i] ?? 0) : 0;
      rows += `<div class="wd${i===0?' today':''}">
        <div class="wdn">${i===0 ? '오늘' : DAYS[dt.getDay()]}</div>
        <div class="wdd">${dt.getMonth()+1}/${dt.getDate()}</div>
        <div class="wic ic">${icon(dl.weather_code[i], true)}</div>
        <div class="wpop${pop < 20 ? ' low' : ''}">${pop}%</div>
        <div class="wmin">${Math.round(lo)}°</div>
        <div class="wbar"><i style="--a:${a}%;--b:${b}%;--t:${t}%"></i></div>
        <div class="wmax">${Math.round(hi)}°</div>
      </div>`;
    }
    return `<div class="wh">주간 날씨</div><div class="wl">${rows}</div>`;
  }

  // 2페이지 날짜 블록: 큰 일(日) 숫자 | 요일 / 연.월
  function dateHTML(){
    const t = new Date(), w = t.getDay();
    return `<div class="dt${w===6?' sat':w===0?' sun':''}"><span class="dd">${pad(t.getDate())}</span>`
      + `<span class="dm"><span class="dw">${DAYS[w]}요일</span><span class="dy">${t.getFullYear()}. ${pad(t.getMonth()+1)}</span></span></div>`;
  }

  // 현재 날씨 시각요소: 아이콘 없음. 밤 + 맑음/구름 조금일 때만 실제 월령의 달 표시
  function nowVisual(c){
    const t = typeOf(c.weather_code);
    return (c.is_day !== 1 && (t === 'clear' || t === 'partly')) ? moonSVG(moonPhase()) : '';
  }

  function render(d, stale){
    const c = d.current;
    const hourNow = +c.time.slice(11,13);
    const useTomorrow = hourNow >= 18;          // 18시 이후 내일 오전/오후
    const day = useTomorrow ? d.daily.time[1] : d.daily.time[0];
    const pre = useTomorrow ? '내일 ' : '';
    const am = summarize(d.hourly, day, 6, 12);
    const pm = summarize(d.hourly, day, 12, 18);
    const u = new Date();
    const html = `
      <div class="hdr">${dateHTML()}<div class="loc">${PIN}<span>${cfg.name}</span></div></div>
      <div class="now">
        ${nowVisual(c)}
        <div>
          <div class="t">${Math.round(c.temperature_2m)}°</div>
          <div class="d">${desc(c.weather_code)} · 체감 ${Math.round(c.apparent_temperature)}°<br>
          최고 ${Math.round(d.daily.temperature_2m_max[0])}° 최저 ${Math.round(d.daily.temperature_2m_min[0])}° · 습도 ${c.relative_humidity_2m}% · 바람 ${c.wind_speed_10m.toFixed(1)}m/s</div>
        </div>
      </div>
      <div class="periods">
        ${periodHTML(pre+'오전','06–12시',am, !useTomorrow && hourNow >= 12)}
        ${periodHTML(pre+'오후','12–18시',pm, false)}
      </div>
      <div class="upd">${stale ? '⚠ 오프라인 · 마지막 자료 표시 중' : `업데이트 ${pad(u.getHours())}:${pad(u.getMinutes())}`} · Open-Meteo</div>`;
    document.querySelectorAll('.wxbox').forEach(b => b.innerHTML = html);
    $('week').innerHTML = weekHTML(d);
    applyScene(d);
  }

  setInterval(tick, 1000); tick();
  loadWeather();
  setInterval(loadWeather, 15*60*1000);       // 15분 주기 자동 갱신

  // ---------- 페이지 전환 (좌우 스와이프) ----------
  let dotsT;
  function showPage(n, animate=true){
    cfg.page = Math.max(0, Math.min(1, n)); save();
    const tr = $('track');
    if (!animate) tr.style.transition = 'none';
    tr.style.transform = `translateX(${-cfg.page*100}vw)`;
    if (!animate) requestAnimationFrame(() => tr.style.transition = '');
    document.querySelectorAll('#dots i').forEach((el,i) => el.classList.toggle('on', i === cfg.page));
    $('dots').classList.remove('hide');
    clearTimeout(dotsT); dotsT = setTimeout(() => $('dots').classList.add('hide'), 10000);
  }
  showPage(cfg.page, false);

  const EDGE = 32;            // 화면 가장자리(안드로이드 뒤로가기 제스처 영역) 제외
  let sx = null, sy = 0, swiped = false;
  $('track').addEventListener('pointerdown', e => {
    swiped = false;
    sx = (e.clientX < EDGE || e.clientX > innerWidth - EDGE) ? null : e.clientX;
    sy = e.clientY;
  });
  $('track').addEventListener('pointerup', e => {
    if (sx === null) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    sx = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5){
      swiped = true;
      showPage(cfg.page + (dx < 0 ? 1 : -1));
    }
  });
  $('track').addEventListener('pointercancel', () => sx = null);

  // ---------- 화면 켜짐 유지 (Wake Lock) ----------
  let lock = null;
  async function keepAwake(){
    try{
      if ('wakeLock' in navigator && document.visibilityState === 'visible'){
        lock = await navigator.wakeLock.request('screen');
        $('wl').classList.add('on');
        lock.addEventListener('release', () => $('wl').classList.remove('on'));
      }
    }catch(e){ $('wl').classList.remove('on'); }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible'){ keepAwake(); loadWeather(); }
  });
  keepAwake();
  setInterval(() => { if (!lock || lock.released) keepAwake(); }, 30000);

  // ---------- 탭: 위치명 → 설정 / 그 외 → 전체화면 ----------
  $('track').addEventListener('click', async e => {
    if (swiped){ swiped = false; return; }
    if (e.target.closest('.loc')){ openSettings(); return; }
    try{ if (!document.fullscreenElement) await document.documentElement.requestFullscreen(); }catch(_){}
    keepAwake();
  });

  // ---------- 새로고침 버튼: 캐시 무시하고 최신 버전으로 다시 불러오기 ----------
  $('rf').addEventListener('click', e => {
    e.stopPropagation();
    $('rf').classList.add('spin');
    const u = new URL(location.href);
    u.searchParams.set('r', Date.now());
    setTimeout(() => location.replace(u.toString()), 150);
  });

  // ---------- 설정 패널 ----------
  const set = $('set');
  function openSettings(){
    $('h24').checked = cfg.h24; $('nightDim').checked = cfg.nightDim;
    $('q').value = ''; $('res').innerHTML = '';
    set.classList.add('show');
  }
  $('close').addEventListener('click', () => set.classList.remove('show'));
  $('h24').addEventListener('change', e => { cfg.h24 = e.target.checked; save(); tick(); });
  $('nightDim').addEventListener('change', e => { cfg.nightDim = e.target.checked; save(); tick(); });

  let qT;
  $('q').addEventListener('input', e => {
    clearTimeout(qT);
    const v = e.target.value.trim();
    if (v.length < 2){ $('res').innerHTML=''; return; }
    qT = setTimeout(async () => {
      try{
        const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(v)}&count=6&language=ko&format=json`);
        const j = await r.json();
        const list = j.results || [];
        $('res').innerHTML = list.length ? '' : '<div style="color:#888;margin-top:8px">검색 결과 없음</div>';
        list.forEach(p => {
          const b = document.createElement('button');
          b.textContent = [p.name, p.admin1, p.country].filter(Boolean).join(', ');
          b.onclick = () => { cfg.name = p.name; cfg.lat = p.latitude; cfg.lon = p.longitude; save(); set.classList.remove('show'); loadWeather(); };
          $('res').appendChild(b);
        });
      }catch(_){ $('res').innerHTML = '<div style="color:#888;margin-top:8px">검색 실패</div>'; }
    }, 400);
  });

  $('gps').addEventListener('click', () => {
    if (!navigator.geolocation) return;
    $('gps').textContent = '위치 확인 중…';
    navigator.geolocation.getCurrentPosition(pos => {
      cfg.lat = +pos.coords.latitude.toFixed(4); cfg.lon = +pos.coords.longitude.toFixed(4);
      cfg.name = '현재 위치'; save(); set.classList.remove('show'); $('gps').textContent = '현재 위치 사용'; loadWeather();
    }, () => { $('gps').textContent = '위치 권한 거부됨'; }, {timeout:10000});
  });
})();
</script>
</body>
</html>
